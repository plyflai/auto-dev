<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto Dev 任务进度</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #101513;
      --ink: #e8eee9;
      --muted: #a7b0a9;
      --line: #394740;
      --line-soft: #28332e;
      --done: #59c8a7;
      --done-soft: #143b30;
      --active: #8ab4ff;
      --active-soft: #172f55;
      --paused: #e5b367;
      --paused-soft: #473416;
      --blocked: #ff897f;
      --blocked-soft: #512521;
      --slate: #abb6af;
      --slate-soft: #2a3731;
      --main-soft: #18211d;
      --focus-line: #a9c5ff;
      --white: #171e1b;
      --proof: #68d2ae;
      --proof-soft: #153c30;
      --unknown: #e5c98f;
      --unknown-soft: #463921;
      --overlay-surface: rgba(23,30,27,.82);
      --raised-shadow: rgba(0,0,0,.28);
      --execution-border: #38564a;
      --execution-review: #221c12;
      --execution-blocked: #271817;
      --status-paused-border: #76592e;
      --status-blocked-border: #79423e;
      --metric-surface: rgba(24,33,29,.74);
      --node-root-surface: rgba(28,39,34,.76);
      --node-current-surface: rgba(23,47,85,.72);
      --node-current-paused-surface: rgba(71,52,22,.76);
      --checkpoint-active-border: #4b6b9f;
      --checkpoint-done-border: #3a765f;
      --checkpoint-paused-border: #76592e;
      --checkpoint-blocked-border: #79423e;
      --proof-done-border: #3d7a62;
      --node-done: #a9b4ad;
      --review-surface: #221c12;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --paper: #f3f0ea;
      --ink: #1f2522;
      --muted: #6f7772;
      --line: #d2d0c9;
      --line-soft: #e4e1d9;
      --done: #0f766e;
      --done-soft: #d9eee9;
      --active: #2563eb;
      --active-soft: #e0eaff;
      --paused: #a15c07;
      --paused-soft: #f6e6c8;
      --blocked: #b42318;
      --blocked-soft: #f7dfdc;
      --slate: #69737a;
      --slate-soft: #e8eaeb;
      --main-soft: #eef1eb;
      --focus-line: #7398e8;
      --white: #fbfaf7;
      --proof: #176b4d;
      --proof-soft: #dcece4;
      --unknown: #765c34;
      --unknown-soft: #eee7d9;
      --overlay-surface: rgba(251,250,247,.7);
      --raised-shadow: rgba(31,37,34,.05);
      --execution-border: #c5d4cc;
      --execution-review: #fffaf0;
      --execution-blocked: #fff7f5;
      --status-paused-border: #dec69d;
      --status-blocked-border: #dfaea8;
      --metric-surface: rgba(243,240,234,.5);
      --node-root-surface: rgba(238,241,235,.42);
      --node-current-surface: rgba(224,234,255,.45);
      --node-current-paused-surface: rgba(246,230,200,.48);
      --checkpoint-active-border: #9cb5e6;
      --checkpoint-done-border: #9fc9ba;
      --checkpoint-paused-border: #d5bd91;
      --checkpoint-blocked-border: #dfaea8;
      --proof-done-border: #a9cdb9;
      --node-done: #56605a;
      --review-surface: #fffaf0;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: "Avenir Next", "PingFang SC", "Helvetica Neue", sans-serif;
      letter-spacing: 0;
    }
    main { width: min(100% - 40px, 760px); margin: 0 auto; padding: 30px 0 52px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .eyebrow { margin: 0 0 8px; color: var(--muted); font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font: 700 28px/1.05 Georgia, "Songti SC", serif; letter-spacing: 0; }
    .header-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .language-switch { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 7px; background: var(--overlay-surface); }
    .language-button { min-width: 58px; min-height: 34px; padding: 6px 10px; border: 0; border-radius: 4px; color: var(--muted); background: transparent; font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; cursor: pointer; }
    .language-button:hover { color: var(--ink); background: var(--slate-soft); }
    .language-button[aria-pressed="true"] { color: var(--ink); background: var(--white); box-shadow: 0 1px 3px var(--raised-shadow); }
    .language-button:focus-visible { outline: 3px solid var(--active-soft); outline-offset: 2px; }
    .theme-toggle { min-height: 32px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: var(--overlay-surface); font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; cursor: pointer; }
    .theme-toggle:hover { background: var(--slate-soft); }
    .theme-toggle[aria-pressed="true"] { border-color: var(--focus-line); color: var(--active); }
    .theme-toggle:focus-visible { outline: 3px solid var(--active-soft); outline-offset: 2px; }
    .connection { display: inline-flex; align-items: center; gap: 7px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--overlay-surface); font-size: 11px; white-space: nowrap; }
    .connection::before { width: 7px; height: 7px; border-radius: 50%; background: var(--slate); content: ""; }
    .connection.live::before { background: var(--done); box-shadow: 0 0 0 4px var(--done-soft); }
    .connection.stale::before { background: var(--blocked); }
    .connection.review::before { background: var(--paused); box-shadow: 0 0 0 4px var(--paused-soft); }
    .project-switcher { display: flex; align-items: center; gap: 9px; min-width: 0; margin-top: 20px; color: var(--muted); font-size: 11px; }
    .project-switcher-label { flex: 0 0 auto; color: var(--muted); }
    .project-context-name { min-width: 0; overflow: hidden; color: var(--ink); font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .context-picker { display: inline-flex; min-width: 0; margin-left: auto; }
    .context-picker select { max-width: 290px; min-height: 30px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: var(--white); font: 650 11px/1.2 "Avenir Next", "PingFang SC", sans-serif; }
    .goal { margin-top: 14px; padding: 14px 0 16px; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line); }
    .goal-label { color: var(--muted); font-size: 11px; }
    .goal-text { display: -webkit-box; max-width: 62ch; margin: 5px 0 0; overflow: hidden; color: var(--ink); font-size: 16px; font-weight: 620; line-height: 1.42; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
    .meta { display: none; }
    .meta-item { display: grid; grid-template-columns: auto auto; column-gap: 6px; align-items: baseline; font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .meta-label { color: var(--muted); }
    .meta-item strong { color: var(--ink); font-weight: 700; }
    .meta-help { grid-column: 1 / -1; color: var(--muted); font: 10px/1.2 "Avenir Next", "PingFang SC", "Helvetica Neue", sans-serif; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 13px; margin-top: 14px; color: var(--muted); font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 8px; height: 8px; border: 1px solid var(--slate); border-radius: 50%; background: var(--paper); }
    .legend .done i { border-color: var(--done); background: var(--done); }
    .legend .reverification_required i { border-color: var(--paused); background: var(--paused); }
    .legend .active i { border-color: var(--active); background: var(--active); }
    .legend .paused i { border-color: var(--paused); background: var(--paused); }
    .legend .planned i { border-color: var(--slate); background: var(--paper); }
    .legend .blocked i { border-color: var(--blocked); background: var(--blocked); }
    .legend .superseded i { border-color: var(--slate); background: var(--slate-soft); }
    .execution-section { margin-top: 20px; }
    .execution-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 18px; padding: 16px 17px 14px; border: 1px solid var(--execution-border); border-left: 4px solid var(--active); border-radius: 6px; background: var(--white); box-shadow: 0 8px 24px var(--raised-shadow); }
    .execution-card.review { border-left-color: var(--paused); background: var(--execution-review); }
    .execution-card.blocked { border-left-color: var(--blocked); background: var(--execution-blocked); }
    .execution-card.paused { border-left-color: var(--paused); background: var(--execution-review); }
    .execution-card.idle { border-left-color: var(--slate); background: var(--main-soft); }
    .execution-copy { min-width: 0; }
    .execution-eyebrow { margin: 0; color: var(--muted); font: 700 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .05em; text-transform: uppercase; }
    .execution-title { margin: 5px 0 0; overflow-wrap: anywhere; color: var(--ink); font: 700 21px/1.18 Georgia, "Songti SC", serif; }
    .execution-outcome { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.42; }
    .execution-next { margin: 9px 0 0; color: var(--ink); font-size: 12px; font-weight: 590; line-height: 1.42; }
    .execution-status { align-self: start; padding: 4px 7px; border: 1px solid var(--line); border-radius: 3px; color: var(--active); background: var(--active-soft); font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .execution-card.review .execution-status, .execution-card.paused .execution-status { color: var(--paused); background: var(--paused-soft); border-color: var(--status-paused-border); }
    .execution-card.blocked .execution-status { color: var(--blocked); background: var(--blocked-soft); border-color: var(--status-blocked-border); }
    .execution-card.idle .execution-status { color: var(--slate); background: var(--slate-soft); }
    .execution-metrics { display: flex; flex-wrap: wrap; grid-column: 1 / -1; gap: 7px; }
    .execution-metrics span { display: inline-flex; padding: 4px 6px; border: 1px solid var(--line-soft); border-radius: 3px; color: var(--muted); background: var(--metric-surface); font: 600 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .execution-details { grid-column: 1 / -1; margin: 1px 0 0; padding-top: 10px; border-top: 1px solid var(--line-soft); }
    .execution-details > summary { position: relative; padding-right: 16px; font-size: 11px; font-weight: 650; }
    .execution-details > summary::after, .project-overview > summary::after, .overview-section > summary::after { position: absolute; top: 50%; right: 3px; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-65%) rotate(45deg); transition: transform .16s ease, border-color .16s ease; content: ""; }
    .execution-details[open] > summary::after, .project-overview[open] > summary::after, .overview-section[open] > summary::after { border-color: var(--active); transform: translateY(-22%) rotate(225deg); }
    .execution-records { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; margin: 9px 0 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .execution-records dt { color: var(--muted); }
    .execution-records dd { min-width: 0; margin: 0; overflow-wrap: anywhere; color: var(--ink); }
    .intake-panel { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--slate); background: var(--main-soft); }
    .intake-panel.authorized { border-left-color: var(--done); background: var(--done-soft); }
    .intake-panel.waiting { border-left-color: var(--paused); background: var(--paused-soft); }
    .intake-panel.pending { border-left-color: var(--blocked); background: var(--blocked-soft); }
    .intake-copy { min-width: 0; }
    .intake-copy h2 { margin: 0; font-size: 12px; }
    .intake-copy p { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; overflow-wrap: anywhere; }
    .intake-state { align-self: center; padding: 4px 6px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); background: var(--white); font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .execution-timeline-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-top: 22px; }
    .execution-timeline-title { margin: 0; color: var(--ink); font: 700 16px/1.2 Georgia, "Songti SC", serif; }
    .hierarchy-list { margin: 12px 0 0; padding: 0; list-style: none; }
    .hierarchy-row { position: relative; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 9px; align-items: start; padding: 9px 0 9px calc(var(--outcome-depth, 0) * 18px); border-bottom: 1px solid var(--line-soft); }
    .hierarchy-row:last-child { border-bottom: 0; }
    .hierarchy-row::before { width: 7px; height: 7px; margin-top: 5px; border: 1px solid var(--slate); border-radius: 50%; background: var(--paper); content: ""; }
    .hierarchy-row[data-status="active"]::before, .hierarchy-row[data-status="completed"]::before { border-color: var(--done); background: var(--done); }
    .hierarchy-row[data-status="blocked"]::before { border-color: var(--blocked); background: var(--blocked); }
    .hierarchy-row[data-status="proposed"]::before { border-color: var(--active); background: var(--active-soft); }
    .hierarchy-row h3 { margin: 0; font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; }
    .hierarchy-row p { margin: 3px 0 0; color: var(--muted); font-size: 11px; line-height: 1.4; overflow-wrap: anywhere; }
    .row-status { padding: 3px 5px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); background: var(--white); font: 600 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .row-relations { grid-column: 2 / -1; color: var(--muted); font: 10px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .project-overview { margin-top: 30px; padding-top: 15px; border-top: 1px solid var(--line); }
    .project-overview > summary { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 2px 18px 3px 0; }
    .project-overview-title { color: var(--ink); font: 700 15px/1.2 Georgia, "Songti SC", serif; }
    .project-overview-summary { min-width: 0; overflow: hidden; color: var(--muted); font: 10px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    .project-overview-content { margin-top: 14px; padding: 0 0 2px 12px; border-left: 2px solid var(--line-soft); }
    .project-overview-description { max-width: 68ch; margin: 0 0 12px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .overview-section { margin: 0; border-top: 1px solid var(--line-soft); }
    .overview-section:last-child { border-bottom: 1px solid var(--line-soft); }
    .overview-section > summary { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 11px 18px 11px 0; }
    .overview-section-title { color: var(--ink); font-size: 12px; font-weight: 700; }
    .overview-section-count { color: var(--muted); font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .overview-section > :not(summary) { margin-top: 0; padding: 0 0 10px; }
    .capability-list, .activity-list { margin-top: 0; }
    .capability-row, .activity-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
    .capability-row:last-child, .activity-row:last-child { border-bottom: 0; }
    .capability-row h3, .activity-row h3 { margin: 0; font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; }
    .capability-row p, .activity-row p { margin: 3px 0 0; color: var(--muted); font-size: 11px; line-height: 1.4; overflow-wrap: anywhere; }
    .row-meta { color: var(--muted); font: 10px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; white-space: nowrap; }
    .empty-plane { padding: 11px 0 2px; color: var(--muted); font-size: 12px; }
    .outcome-overview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; margin-top: 14px; border: 1px solid var(--line); background: var(--line); }
    .outcome-metric { min-width: 0; padding: 11px 12px; background: var(--white); }
    .outcome-metric span { display: block; color: var(--muted); font-size: 10px; line-height: 1.25; }
    .outcome-metric strong { display: block; margin-top: 4px; color: var(--ink); font: 700 17px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .timeline { position: relative; margin-top: 20px; padding-bottom: 8px; }
    .timeline::before { position: absolute; top: 9px; bottom: 18px; left: 9px; width: 1px; background: var(--line); content: ""; }
    .node { position: relative; display: grid; grid-template-columns: 20px 1fr; gap: 13px; margin: 0 0 17px var(--indent, 0px); }
    .node[data-depth="0"] { margin-bottom: 26px; }
    .node[data-depth]:not([data-depth="0"])::before { position: absolute; top: 10px; left: -21px; width: 20px; border-top: 1px solid var(--line); content: ""; }
    .node-dot { position: relative; z-index: 1; display: grid; place-items: center; width: 19px; height: 19px; border: 4px solid var(--paper); border-radius: 50%; background: var(--slate); box-shadow: 0 0 0 1px var(--line); color: var(--white); font: 700 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .node.done .node-dot { background: var(--done); box-shadow: 0 0 0 1px var(--done); }
    .node.done .node-dot::after { content: "ok"; }
    .node.reverification_required .node-dot { background: var(--paused); box-shadow: 0 0 0 1px var(--paused), 0 0 0 5px var(--paused-soft); }
    .node.reverification_required .node-dot::after { content: "!"; }
    .node.active .node-dot { background: var(--active); box-shadow: 0 0 0 1px var(--active), 0 0 0 5px var(--active-soft); }
    .node.active .node-dot::after { content: ">"; }
    .node.paused .node-dot { background: var(--paused); box-shadow: 0 0 0 1px var(--paused), 0 0 0 5px var(--paused-soft); }
    .node.paused .node-dot::after { content: "||"; }
    .node.planned .node-dot { background: var(--paper); }
    .node.blocked .node-dot { background: var(--blocked); box-shadow: 0 0 0 1px var(--blocked); }
    .node.blocked .node-dot::after { content: "!"; }
    .node.superseded .node-dot { background: var(--paper); box-shadow: 0 0 0 1px var(--slate); color: var(--slate); }
    .node.superseded .node-dot::after { content: "-"; }
    .node-body { min-width: 0; padding-top: 1px; }
    .node[data-depth="0"] .node-body { padding: 10px 11px 3px; border-top: 1px solid var(--line); background: var(--node-root-surface); }
    .node[data-depth]:not([data-depth="0"]) .node-body { padding-left: 12px; border-left: 2px solid var(--line-soft); }
    .node.is-ancestor .node-body { border-left-color: var(--active-soft); }
    .node.is-current .node-body { margin: -7px 0; padding: 8px 12px; border-left: 3px solid var(--active); background: var(--node-current-surface); }
    .node.is-current.paused .node-body { border-left-color: var(--paused); background: var(--node-current-paused-surface); }
    .node-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: baseline; gap: 9px; }
    .node-context { display: inline-flex; align-items: baseline; gap: 7px; }
    .node-code { color: var(--muted); font: 600 10px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .node[data-depth="0"] .node-code { color: var(--ink); font-size: 14px; font-weight: 800; }
    .node-title { min-width: 0; display: -webkit-box; overflow: hidden; overflow-wrap: anywhere; -webkit-box-orient: vertical; -webkit-line-clamp: 3; font-size: 13px; line-height: 1.38; font-weight: 560; }
    .node[data-depth="0"] .node-title { font-size: 15px; font-weight: 700; }
    .node-kind { padding: 3px 5px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); font: 600 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .node[data-depth="0"] .node-kind { border-color: var(--done-soft); color: var(--done); background: var(--white); }
    .node-status { flex: 0 0 auto; color: var(--muted); font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .node-result { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: baseline; gap: 8px; margin-top: 7px; }
    .milestone-checkpoint-chain { display: flex; min-width: 0; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 8px; }
    .milestone-checkpoint-point { display: inline-grid; min-width: 0; grid-template-columns: auto auto; align-items: center; gap: 5px; padding: 3px 5px; border: 1px solid var(--line); border-radius: 3px; background: var(--white); font: 600 9px/1.15 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .milestone-checkpoint-point.before { border-color: var(--checkpoint-active-border); color: var(--active); background: var(--active-soft); }
    .milestone-checkpoint-point.after { border-color: var(--checkpoint-done-border); color: var(--done); background: var(--done-soft); }
    .milestone-checkpoint-point[data-status="pending"] { border-color: var(--checkpoint-paused-border); color: var(--paused); background: var(--paused-soft); }
    .milestone-checkpoint-point[data-status="missing_ref"], .milestone-checkpoint-point[data-status="mismatched_ref"] { border-color: var(--checkpoint-blocked-border); color: var(--blocked); background: var(--blocked-soft); }
    .milestone-checkpoint-label { white-space: nowrap; }
    .milestone-checkpoint-point code { color: inherit; font: 700 9px/1.15 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .milestone-checkpoint-link { position: relative; flex: 0 0 13px; width: 13px; height: 1px; background: var(--line); }

        '<span class="meta-item"><span class="meta-label">' + esc(t("nodeCount")) + '</span><strong>' + rows.length + "</strong></span>",
        '<span class="meta-item"><span class="meta-label">' + esc(t("currentFocus")) + '</span><strong>' + esc(currentRow ? currentRow.code : t("noFocus")) + "</strong></span>",
        '<span class="meta-item"><span class="meta-label">' + esc(t("currentStatus")) + '</span><strong>' + esc(currentView ? statusLabel(currentView.key) : t("noFocus")) + "</strong></span>",
        '<span class="meta-item"><span class="meta-label">' + esc(t("taskLifecycle")) + '</span><strong>' + esc(statusLabel(state.status || "idle")) + "</strong></span>",
        '<span class="meta-item"><span class="meta-label">' + esc(t("gapCount")) + '</span><strong>' + openGaps.length + "</strong></span>"
      ].join("");
      $("outcome-overview").setAttribute("aria-label", t("outcomeOverview"));
      $("outcome-overview").innerHTML = [
        [t("provedOutcomes"), (outcomeSummary.proved_outcomes || 0) + "/" + (outcomeSummary.contracted_outcomes || 0)],
        [t("passedProofs"), outcomeSummary.passed_proofs || 0],
        [t("failedProofs"), outcomeSummary.failed_proofs || 0],
        [t("legacyNodes"), outcomeSummary.legacy_nodes || 0],
      ].map((entry) => '<div class="outcome-metric"><span>' + esc(entry[0]) + '</span><strong>' + esc(entry[1]) + "</strong></div>").join("");
      const counts = rows.reduce((result, row) => {
        const key = viewStatus(state, row.node).key;
        result[key] = (result[key] || 0) + 1;
        return result;
      }, {});
      const legendOrder = ["reverification_required", "done", "active", "paused", "planned", "blocked", "superseded"];
      $("legend").innerHTML = legendOrder.filter((key) => counts[key]).map((key) => {
        return '<span class="' + key + '"><i></i>' + esc(statusLabel(key)) + " " + counts[key] + "</span>";
      }).join("");
      const timeline = $("timeline");
      const expanded = new Set(Array.from(timeline.querySelectorAll("details[open]")).map((detail) => detail.dataset.nodeId));
      if (!rows.length) {
        const directOutcome = (state.delivery_contract || {}).outcome;
        const directNode = directOutcome ? { id: "run", outcome: directOutcome, status: state.status } : null;
        const directProof = directNode ? nodeProofView(state, directNode) : null;
        const candidates = Array.isArray(state.task_candidates) ? state.task_candidates : [];
        timeline.innerHTML = directNode ? '<article class="direct-outcome"><h2>' + esc(t("directOutcome")) + '</h2><p>' + esc(directOutcome.primary) + '</p><div class="node-result"><span class="outcome-kind">' + esc(outcomeKindLabel(directOutcome.kind)) + '</span><span></span><span class="proof-state ' + esc(directProof.key) + '">' + esc(directProof.label) + "</span></div></article>" : candidates.length ? '<article class="direct-outcome"><h2>' + esc(t("candidateTasks")) + '</h2>' + candidates.map((candidate) => '<p><strong>' + esc(candidate.task || candidate.id) + '</strong> · ' + esc(statusLabel(candidate.status || "paused")) + '</p>').join("") + '</article>' : '<div class="empty">' + esc(t("empty")) + "</div>";
      } else {
        timeline.innerHTML = rows.map((row) => {
          const node = row.node;
          const nodeView = viewStatus(state, node);
          const proofView = nodeProofView(state, node);
          const classes = "node " + nodeView.key + (nodeView.current ? " is-current" : "") + (focus.has(node.id) && !nodeView.current ? " is-ancestor" : "");
          const detailContent = renderNodeDetails(state, row, projection, gapsByNode);
          const title = detailContent ? '<details class="node-details" data-node-id="' + esc(node.id) + '"><summary class="node-title">' + esc(row.label) + "</summary>" + detailContent + "</details>" : '<div class="node-title">' + esc(row.label) + "</div>";
          const checkpointChain = renderMilestoneCheckpointChain(state, node, row.code);
          const rollingMeta = rollingNodeMeta(state, node);
          const resultLine = node.outcome ? '<div class="node-result"><span class="outcome-kind">' + esc(outcomeKindLabel(node.outcome.kind)) + '</span><span class="outcome-primary">' + esc(node.outcome.primary) + (rollingMeta ? '<span class="detail-meta">' + esc(rollingMeta) + '</span>' : '') + '</span><span class="proof-state ' + esc(proofView.key) + '">' + esc(proofView.label) + "</span></div>" : '<div class="node-result"><span class="proof-state legacy">' + esc(rollingMeta || proofView.label) + "</span></div>";
          const statusTitle = nodeView.reverificationIssue ? [t("proofRevalidationRequired"), nodeView.reverificationIssue.proof_id, nodeView.reverificationIssue.reason].filter(Boolean).join(" · ") : "";
          return '<article class="' + classes + '" data-node-id="' + esc(node.id) + '" data-depth="' + row.depth + '" style="--indent:' + (row.depth * 30) + 'px">' +
            '<div class="node-dot" aria-hidden="true"></div>' +
            '<div class="node-body"><div class="node-head"><div class="node-context"><div class="node-code">' + esc(row.code) + '</div><div class="node-kind">' + esc(nodeRoleLabel(node)) + '</div></div>' + title + '<div class="node-status"' + (statusTitle ? ' title="' + esc(statusTitle) + '"' : "") + '>' + esc(statusLabel(nodeView.key)) + "</div></div>" + checkpointChain + resultLine + "</div></article>";
        }).join("");
        restoreExpanded(expanded);
      }
      const gaps = $("gaps");
      gaps.hidden = !openGaps.length;
      gaps.innerHTML = openGaps.length ? '<p class="section-label">' + esc(t("unresolvedGaps")) + "</p>" + openGaps.map((gap) => {
        const row = gap.node_id ? projection.rowById.get(gap.node_id) : null;
        const prefix = row ? '<strong>' + esc(row.code) + "</strong> " : "";
        return '<div class="gap ' + (gap.blocking ? "blocking" : "") + '"><div>' + prefix + esc(gap.summary || (locale === "zh" ? "未命名缺口" : "Untitled gap")) + '<span class="gap-meta">' + esc(gap.owner || "agent") + " · " + esc(gap.blocking ? t("blocking") : t("notBlocking")) + "</span></div></div>";
      }).join("") : "";
      const unattributed = $("unattributed");
      unattributed.hidden = !unattributedActions.length;
      unattributed.innerHTML = unattributedActions.length ? '<p class="section-label">' + esc(t("unattributedActions")) + "</p>" + unattributedActions.map((action) => {
        const reason = action.reason === "missing_node" ? (locale === "zh" ? "缺少计划节点" : "Missing plan node") : action.reason === "conflicting_nodes" ? (locale === "zh" ? "节点归属冲突" : "Conflicting node attribution") : (locale === "zh" ? "节点已不在当前计划中" : "Node is no longer in the current plan");
        return '<div class="gap blocking"><div><strong>' + esc(action.action_id || "-") + "</strong> " + esc(action.summary || (locale === "zh" ? "未命名动作" : "Untitled action")) + '<span class="gap-meta">' + esc(reason) + " · " + esc(action.last_at || action.first_at || "-") + "</span></div></div>";
      }).join("") : "";
      const verificationIssues = Array.isArray(state.verification_issues) ? state.verification_issues : [];
      const verificationPanel = $("verification-issues");
      verificationPanel.hidden = !verificationIssues.length;
      verificationPanel.innerHTML = verificationIssues.length
        ? '<p class="section-label">' + esc(t("verificationIssues")) + "</p>" + verificationIssues.map((issue) => '<div class="gap blocking"><div><strong>' + esc(issue.node_id || "-") + "</strong> " + esc(issue.proof_id || issue.kind || "-") + '<span class="gap-meta">' + esc(issue.reason || "-") + "</span></div></div>").join("")
        : "";
      const productPanel = $("product-review-summary");
      const productReceipt = typeof state.product_receipt === "string" ? state.product_receipt.trim() : "";
      const productReviewVisible = reviewReady && Boolean(productReceipt);
      productPanel.hidden = !productReviewVisible;
      productPanel.innerHTML = productReviewVisible
        ? '<p class="section-label">' + esc(t("productReviewSummary")) + "</p><div class=\"product-review-receipt\">" + esc(productReceipt) + "</div>"
        : "";
      const diagnostic = continuity.diagnostic || {};
      const diagnosticPanel = $("diagnostic-summary");
      const diagnosticHypotheses = Array.isArray(diagnostic.hypotheses) ? diagnostic.hypotheses : [];
      const diagnosticObservations = Array.isArray(diagnostic.observations) ? diagnostic.observations : [];
      const diagnosticLastObservation = diagnosticObservations[diagnosticObservations.length - 1] || {};
      const diagnosticCaseSearch = diagnostic.case_search || {};
      const diagnosticReproduction = diagnostic.reproduction || {};
      const diagnosticResolution = diagnostic.resolution || {};
      const diagnosticRecovery = diagnostic.recovery || {};
      diagnosticPanel.hidden = diagnostic.profile !== "deep";
      diagnosticPanel.innerHTML = diagnostic.profile === "deep"
        ? '<p class="section-label">' + esc(t("diagnosticSummary")) + "</p>"
          + '<div class="impact-grid">'
          + '<div><strong>' + esc(t("diagnosticSymptom")) + '</strong><span>' + esc((diagnostic.symptom || {}).summary || "-") + "</span></div>"
          + '<div><strong>' + esc(t("diagnosticReproduction")) + '</strong><span>' + esc(diagnosticReproduction.gate || "-") + "</span></div>"
          + '<div><strong>' + esc(t("diagnosticCases")) + '</strong><span>' + esc((diagnosticCaseSearch.status || "not_run") + " · " + values(diagnosticCaseSearch.candidate_case_ids).length) + "</span></div>"
          + '<div><strong>' + esc(t("diagnosticResolution")) + '</strong><span>' + esc((diagnosticResolution.outcome || "-") + (diagnosticResolution.fresh === false ? " · stale" : "")) + "</span></div>"
          + '<div><strong>' + esc(t("diagnosticRecovery")) + '</strong><span>' + esc((diagnosticRecovery.status || "unverified") + (diagnosticRecovery.fresh === false ? " · stale" : "")) + "</span></div>"
          + '<div><strong>' + esc(t("diagnosticNextProbe")) + '</strong><span>' + esc(diagnostic.next_probe || "-") + "</span></div>"
          + "</div>"
          + (diagnosticHypotheses.length
            ? '<details><summary>' + esc(t("diagnosticHypotheses")) + " · " + diagnosticHypotheses.length + '</summary><ul class="detail-list">'
              + diagnosticHypotheses.map((item) => '<li><strong>' + esc(item.id || "-") + "</strong> " + esc(item.statement || "-") + '<span class="gap-meta">' + esc(item.effective_status || item.status || "pending") + "</span></li>").join("")
              + "</ul></details>"
            : "")
          + (diagnosticLastObservation.id
            ? '<div class="gap"><div><strong>' + esc(diagnosticLastObservation.id) + "</strong> " + esc(diagnosticLastObservation.verdict || "-")
              + '<span class="gap-meta">' + esc(t("expected")) + ": " + esc(diagnosticLastObservation.expected || "-") + " · " + esc(t("actual")) + ": " + esc(diagnosticLastObservation.actual || "-") + "</span></div></div>"
            : "")
        : "";
      const impact = summary.impact || {};
      const latestImpact = impact.latest || null;
      const impactPanel = $("impact-summary");
      impactPanel.hidden = !latestImpact;
      if (latestImpact) {
        const targets = latestImpact.targets || {};
        const targetValues = values(targets.symbols).concat(values(targets.files));
        const staleReasons = values(latestImpact.stale_reasons);
        const details = [
          t("impactTargets") + "=" + (targetValues.join(", ") || "-"),
          t("impactTests") + "=" + values(latestImpact.affected_tests).length,
          t("impactPreserve") + "=" + values(latestImpact.preservation_items).length,
          t("impactUncertainty") + "=" + values(latestImpact.uncertainty).length,
        ];
        if (staleReasons.length) details.push(staleReasons.join(", "));
        impactPanel.innerHTML = '<p class="section-label">' + esc(t("impactSummary")) + '</p><div class="gap ' + (latestImpact.fresh ? "" : "blocking") + '"><div><strong>' + esc(latestImpact.fresh ? t("fresh") : t("stale")) + '</strong> ' + esc(latestImpact.receipt_id || "-") + '<span class="gap-meta">' + esc(details.join(" · ")) + "</span></div></div>";
      } else {
        impactPanel.innerHTML = "";
      }
      const policy = state.workspace_policy || {};
      const policyPanel = $("policy-summary");
      const policyVisible = policy.status === "configured" || policy.status === "unavailable";
      policyPanel.hidden = !policyVisible;
      if (policyVisible) {
        const counts = policy.rule_counts || {};
        const approvals = policy.approvals || {};
        const ruleCount = Number(counts.forbidden_paths || 0) + Number(counts.approval_paths || 0) + Number(counts.sensitive_paths || 0);
        const details = [
          t("policyRevision") + "=R" + (policy.revision == null ? "-" : policy.revision),
          t("policyRules") + "=" + ruleCount,
          t("policyApprovals") + "=" + Number(approvals.fresh_count || 0),
        ];
        const title = policy.status === "unavailable" ? t("policyUnavailable") : t("policySummary");
        if (policy.error) details.push(policy.error);
        policyPanel.innerHTML = '<p class="section-label">' + esc(t("policySummary")) + '</p><div class="gap ' + (policy.status === "unavailable" ? "blocking" : "") + '"><div><strong>' + esc(title) + '</strong><span class="gap-meta">' + esc(details.join(" · ")) + "</span></div></div>";
      } else {
        policyPanel.innerHTML = "";
      }
      const checkpoint = continuity.last_checkpoint;
      const checkpointRow = checkpoint && projection.rowById.get(checkpoint.node_id);
      $("checkpoint").hidden = !checkpoint;
      $("checkpoint").innerHTML = checkpoint ? esc(t("checkpoint")) + "：<strong>" + esc(checkpointRow ? checkpointRow.code + " " + checkpointRow.label : checkpoint.node_id) + "</strong> · " + esc(checkpoint.summary) + "<br><span>" + esc(checkpoint.at) + "</span>" : "";
      const recordedWorkspacePoints = Array.isArray(continuity.workspace_points) ? continuity.workspace_points : [];
      const archivePoints = Array.isArray(summary.workspace_points) ? summary.workspace_points : recordedWorkspacePoints;
      renderArchivePoints(archivePoints);
      renderControlPlane(state);
      renderHierarchy(state);
      renderDependencies(state);
      $("updated").textContent = t("statusUpdate") + " " + (continuity.updated_at || state.started_at || "-") + " · " + t("refresh") + " · " + t("projection") + " · " + t("task") + " " + (state.id || "idle") + " · " + t("workspacePoints") + " " + archivePoints.length;
    }
    function setError() {
      $("connection").className = "connection stale";
      $("connection").textContent = t("offline");
    }
    function apiPath(path) {
      const query = new URLSearchParams(window.location.search);
      if (selectedProjectContext) query.set("project_context", selectedProjectContext);
      const suffix = query.toString();
      return suffix ? path + "?" + suffix : path;
    }
    async function fetchState() {
      try {
        if (!sseHealthy) transport = "polling";
        render(await (await fetch(apiPath("/api/state"), { cache: "no-store" })).json());
      }
      catch (_) { setError(); }
    }
    function connect() {
      if (eventSource) eventSource.close();
      const source = new EventSource(apiPath("/api/events"));
      eventSource = source;
      source.onopen = () => { sseHealthy = true; transport = "sse"; if (latest) render(latest); };
      source.onmessage = (event) => { try { transport = "sse"; render(JSON.parse(event.data)); } catch (_) { setError(); } };
      source.onerror = () => {
        sseHealthy = false;
        setError();
        source.close();
        if (eventSource === source) setTimeout(connect, 1500);
      };
    }
    document.querySelectorAll("[data-locale]").forEach((button) => {
      button.addEventListener("click", () => setLocale(button.dataset.locale));
    });
    $("theme-toggle").addEventListener("click", () => setTheme(theme === "dark" ? "light" : "dark"));
    $("project-context-select").addEventListener("change", (event) => {
      selectedProjectContext = event.target.value || null;
      fetchState();
      connect();
    });
    applyLocale();
    fetchState();
    connect();
    setInterval(() => { if (!sseHealthy) fetchState(); }, POLL_INTERVAL_MS);
  </script>
</body>
</html>
